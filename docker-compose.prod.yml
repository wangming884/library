name: library-management-prod

services:
  app:
    image: ${DOCKER_IMAGE:-leemingze/library-management:v1.0.0}
    container_name: library-app-prod
    restart: always
    # 在 Linux 云服务器上使用 host 网络模式，容器与宿主机共享网络
    # 彻底解决容器连接宿主机 MySQL 时的防火墙拦截、网桥路由与 30秒超时问题
    network_mode: "host"
    # 关闭 Tomcat 默认的 8005 关机监听端口（设为 -1 避免与宿主机已有服务冲突闪退）
    # 同时将 HTTP 监听端口动态替换为 APP_PORT（例如 7623）
    command: >
      sh -c "sed -i -E 's/Server port=\"[^\"]*\"/Server port=\"-1\"/g; s/Connector port=\"[0-9]+\"/Connector port=\"${APP_PORT:-7623}\"/g' /usr/local/tomcat/conf/server.xml &&
             exec catalina.sh run"
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: ${APP_PORT:-7623}
      # 直连本地 MySQL (使用 host 模式后，直接填 127.0.0.1 即可访问宿主机 MySQL)
      DB_HOST: ${DB_HOST:-127.0.0.1}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-library_db}
      DB_USERNAME: ${DB_USERNAME:-root}
      DB_PASSWORD: ${DB_PASSWORD:?Please set DB_PASSWORD in .env.prod}
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:-jdbc:mysql://${DB_HOST:-127.0.0.1}:${DB_PORT:-3306}/${DB_NAME:-library_db}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
      LIBRARY_UPLOAD_DIR: /data/library/uploads
      JAVA_OPTS: "${JAVA_OPTS:--Xms512m -Xmx1024m -XX:+UseG1GC}"
    volumes:
      - ./uploads:/data/library/uploads
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
